name: Update star history

on:
  schedule:
    - cron: "23 * * * *" # hourly; off-the-hour to dodge peak scheduler load
  workflow_dispatch:

permissions:
  contents: read # the push authenticates with the deploy key, not GITHUB_TOKEN

concurrency:
  group: update-star-history

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push over SSH with a deploy key: main requires a PR, and the deploy
          # key is the ruleset's only bypass actor. GITHUB_TOKEN cannot push here.
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Fetch stars and regenerate charts
        env:
          TARGET_REPO: lexmount/moli
          # STAR_HISTORY_TOKEN: fine-grained PAT with read access to the target
          # repo's stargazers. Without it the default token still works, but the
          # script falls back to snapshot mode (one data point per run) instead
          # of reconstructing the full timeline.
          GH_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_star_history.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update star history ($(date -u +%F))"
          git pull --rebase --quiet # a PR merge may have landed since checkout
          git push
