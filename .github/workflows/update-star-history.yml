name: Update star history

on:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday 02:17 UTC — low frequency by design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stars and regenerate charts
        env:
          TARGET_REPO: lexmount/moli
          # STAR_HISTORY_TOKEN: fine-grained PAT with read access to the target
          # repo's stargazers. Without it the default token still works, but the
          # script falls back to snapshot mode (one data point per run) instead
          # of reconstructing the full timeline.
          GH_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_star_history.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update star history ($(date -u +%F))"
          git push
